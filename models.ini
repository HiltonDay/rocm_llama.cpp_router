version = 1

# Jukebox defaults. llama.cpp sees the two selected cards as logical GPUs 0 and 1:
# logical 0 = physical card 1 (MI100, 32 GB), logical 1 = physical card 2 (RX 7900 XTX,
# ~22 GB usable for compute). The 16,9 tensor split weights the MI100 heavier and was
# validated for the 256k dense configurations. Cards 0 and 3 (R9700 pair) are reserved
# for vLLM, so HIP_VISIBLE_DEVICES=1,2 is the correct selector for this router.
# F16 KV cache is required by tensor split mode and was the validated cache type.

[*]
flash-attn = 1
parallel = 2
kv-unified = true
tensor-split = 16,9
cache-type-k = f16
cache-type-v = f16

# Primary track: Qwen3.8-27B, loaded at startup. Dense model on the validated
# tensor-split path with the embedded MTP branch (needs a single slot).
# HF card (thinking mode): temp 1.0, top-p 0.95, top-k 20, min-p 0.0, presence 0.0,
# repeat 1.0. Instruct/non-thinking mode alternative: temp 0.7, top-p 0.80, presence 1.5.
[unsloth/Qwen3.8-27B-GGUF:Q8_0]
load-on-startup = true
hf = unsloth/Qwen3.8-27B-GGUF:Q8_0
split-mode = tensor
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-type-k = f16
spec-draft-type-v = f16
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 262144

# Qwen3.6-27B, dense, tensor-split path. HF card (thinking, general tasks): temp 1.0,
# top-p 0.95, top-k 20, min-p 0.0, presence 0.0, repeat 1.0. For precise coding tasks
# the card recommends temp 0.6 with the same other settings. Embedded-MTP GGUFs are
# published separately (Qwen3.6-27B-MTP-GGUF); add spec-type = draft-mtp here only if
# that variant is swapped into hf.
[unsloth/Qwen3.6-27B-GGUF:Q8_0]
hf = unsloth/Qwen3.6-27B-GGUF:Q8_0
split-mode = tensor
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
ctx-size = 262144

# Qwen3.6-35B-A3B, MoE: keep the compatible layer split (tensor split is not supported
# for MoE). HF card (thinking, general tasks): temp 1.0, top-p 0.95, top-k 20,
# min-p 0.0, presence 1.5, repeat 1.0. First use streams ~37 GB into the cache.
[unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0]
hf = unsloth/Qwen3.6-35B-A3B-GGUF:Q8_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
ctx-size = 262144
